<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Moved - khasan.site</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent);
            color: #0f172a;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto 24px;
            color: var(--accent);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .url-text {
            color: var(--accent);
            font-weight: 600;
        }

        .cta-btn {
            display: inline-block;
            width: 100%;
            background: var(--accent);
            color: #0f172a;
            text-decoration: none;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .cta-btn:hover {
            background: var(--accent-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .redirect-info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        #countdown {
            color: var(--text-main);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-id" onclick="setLang('id')">ID</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
        </div>

        <div class="icon-box">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
        </div>

        <h1 id="title">Pemberitahuan Pemindahan</h1>
        <p id="desc">Website dipindah ke <span class="url-text">https://khasan.site</span> untuk sementara.</p>

        <a href="https://khasan.site" class="cta-btn" id="cta">Buka khasan.site Sekarang</a>

        <p class="redirect-info" id="timer-box">
            <span id="timer-text">Dialihkan otomatis dalam</span> <span id="countdown">10</span> <span id="timer-unit">detik...</span>
        </p>
    </div>

    <script>
        const translations = {
            id: {
                title: "Pemberitahuan Pemindahan",
                desc: 'Website dipindah ke <span class="url-text">https://khasan.site</span> untuk sementara.',
                cta: "Buka khasan.site Sekarang",
                timerText: "Dialihkan otomatis dalam",
                timerUnit: "detik..."
            },
            en: {
                title: "Relocation Notice",
                desc: 'This website has been temporarily moved to <span class="url-text">https://khasan.site</span>.',
                cta: "Visit khasan.site Now",
                timerText: "Redirecting automatically in",
                timerUnit: "seconds..."
            }
        };

        function setLang(lang) {
            document.documentElement.lang = lang;
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('desc').innerHTML = translations[lang].desc;
            document.getElementById('cta').textContent = translations[lang].cta;
            document.getElementById('timer-text').textContent = translations[lang].timerText;
            document.getElementById('timer-unit').textContent = translations[lang].timerUnit;

            document.getElementById('btn-id').classList.toggle('active', lang === 'id');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        }

        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "https://khasan.site";
            }
        }, 1000);
    </script>

</body>
</html>
