<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Moved — khasan.site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --surface: rgba(20, 20, 25, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        .ambient-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.05) 45%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 80%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 99px;
            letter-spacing: 0.02em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #818cf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #818cf8;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .lang-toggle {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.25;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .domain-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            color: #e4e4e7;
        }

        .domain-box span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lock-icon {
            color: #4ade80;
            flex-shrink: 0;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 15px 24px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .cta-btn svg {
            transition: transform 0.2s ease;
        }

        .cta-btn:hover svg {
            transform: translateX(3px);
        }

        .progress-wrapper {
            margin-top: 24px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-meta strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 99px;
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="grid-pattern"></div>

    <main class="card">
        <div class="top-bar">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="badge-text">Migrasi Sementara</span>
            </div>
            <div class="lang-toggle">
                <button class="lang-btn active" id="btn-id" onclick="setLang('id')">ID</button>
                <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
            </div>
        </div>

        <h1 id="title">Website Dipindahkan</h1>
        <p id="desc">Layanan ini dialihkan sementara ke alamat baru untuk menjaga performa dan aksesibilitas.</p>

        <div class="domain-box">
            <span>
                <svg class="lock-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                https://khasan.site
            </span>
        </div>

        <a href="https://khasan.site" class="cta-btn">
            <span id="cta-text">Lanjut ke khasan.site</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>

        <div class="progress-wrapper">
            <div class="progress-meta">
                <span id="timer-label">Mengalihkan otomatis</span>
                <span><strong id="countdown">8</strong><span id="timer-unit">d</span></span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            id: {
                badge: "Migrasi Sementara",
                title: "Website Dipindahkan",
                desc: "Website dipindah ke https://khasan.site untuk sementara.",
                cta: "Lanjut ke khasan.site",
                timerLabel: "Mengalihkan otomatis",
                timerUnit: "d"
            },
            en: {
                badge: "Temporary Move",
                title: "Website Relocated",
                desc: "This website has been temporarily moved to https://khasan.site.",
                cta: "Continue to khasan.site",
                timerLabel: "Redirecting automatically",
                timerUnit: "s"
            }
        };

        function setLang(lang) {
            document.documentElement.lang = lang;
            document.getElementById('badge-text').textContent = i18n[lang].badge;
            document.getElementById('title').textContent = i18n[lang].title;
            document.getElementById('desc').textContent = i18n[lang].desc;
            document.getElementById('cta-text').textContent = i18n[lang].cta;
            document.getElementById('timer-label').textContent = i18n[lang].timerLabel;
            document.getElementById('timer-unit').textContent = i18n[lang].timerUnit;

            document.getElementById('btn-id').classList.toggle('active', lang === 'id');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        }

        setLang('id');

        const totalTime = 8;
        let timeLeft = totalTime;
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progress-bar');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            progressBar.style.width = `${(timeLeft / totalTime) * 100}%`;

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "https://khasan.site";
            }
        }, 1000);
    </script>

</body>
</html>
